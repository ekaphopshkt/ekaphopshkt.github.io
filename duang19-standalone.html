<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ดูดวง 19 — ถามเรื่องที่คุณอยากรู้ที่สุด</title>
<meta name="description" content="AI สะท้อนดวงเฉพาะบุคคล ให้คุณใช้ฟรี">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap');
:root{--bg:#0b0a18;--panel:#17142e;--panel2:#21183e;--text:#f5f0ff;--muted:#9d95b7;--line:rgba(255,255,255,.11);--violet:#d8c4ff;--violet2:#a78bfa;--green:#86efac;--rose:#fda4af}*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(124,58,237,.25),transparent 36%),radial-gradient(circle at 12% 35%,rgba(59,130,246,.08),transparent 28%),var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',sans-serif;overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:84px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 14px}.brand{font-family:'Noto Serif Thai',serif;letter-spacing:.16em;font-size:14px}.brand small{display:block;font:11px 'IBM Plex Sans Thai';letter-spacing:0;color:var(--muted);margin-top:4px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#b8a9df;text-transform:uppercase}.display{font-family:'Noto Serif Thai',serif}.page{padding:8px 20px 30px}.hero{position:relative;overflow:hidden;border:1px solid rgba(216,196,255,.16);border-radius:30px;padding:34px 26px;background:linear-gradient(135deg,rgba(47,30,82,.95),rgba(18,17,39,.88));box-shadow:0 0 80px rgba(124,58,237,.18)}.hero:after{content:'✦  ·   ✧     ·   ✦     ·';position:absolute;right:-20px;top:18px;color:#e9ddff55;font-size:24px;letter-spacing:16px;transform:rotate(18deg)}h1{font-size:clamp(34px,10vw,62px);line-height:1.16;margin:20px 0 14px}.hero p{color:#d1cbe0;line-height:1.9;margin:0;max-width:450px}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:active{transform:scale(.97)}.primary{background:var(--violet);color:#1b1233;box-shadow:0 12px 34px rgba(196,181,253,.22)}.primary:hover{box-shadow:0 15px 40px rgba(196,181,253,.38);transform:translateY(-2px)}.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#dcd4ee}.full{width:100%}.muted{color:var(--muted);font-size:13px}.section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.section h2{font:22px 'Noto Serif Thai';margin:6px 0 0}.questions{display:grid;gap:9px}.question,.cat{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#e6def2;border-radius:16px;padding:14px;text-align:left;display:flex;align-items:center;justify-content:space-between}.question:hover,.cat:hover{border-color:#c4b5fd66;background:#c4b5fd0d}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cat{display:block;min-height:92px}.cat b{font-size:22px;display:block;margin-bottom:7px}.note,.card{border:1px solid rgba(216,196,255,.13);background:linear-gradient(145deg,rgba(33,24,62,.72),rgba(18,17,39,.76));border-radius:20px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.14)}.note{display:flex;gap:10px;color:#c8c0d9;font-size:13px;line-height:1.7}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;max-width:680px;margin:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b0a18e8;backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:transparent;color:#817996;padding:7px 3px;font-size:11px;border-radius:13px}.nav span{display:block;font-size:18px;margin-bottom:2px}.nav.active{color:#e2d6ff;background:#c4b5fd16}.back{border:1px solid var(--line);background:#ffffff08;color:#ddd3ee;width:38px;height:38px;border-radius:50%;font-size:18px}.title-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}.title-row h2{font:26px 'Noto Serif Thai';margin:0}.steps{display:flex;align-items:center;gap:10px;margin-bottom:18px}.step{height:29px;width:29px;border-radius:50%;background:#c4b5fd1c;color:#e7ddff;display:grid;place-items:center;font-size:12px}.field{display:grid;gap:6px;margin-top:14px;color:#ddd5e9;font-size:13px}.field span{color:#817995;font-size:11px}.field input,.field select,.field textarea,.coupon{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#090817aa;color:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.coupon:focus{border-color:#c4b5fd99;box-shadow:0 0 0 3px #c4b5fd12}.field select option{background:#17142e}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{border:1px solid var(--line);border-radius:99px;padding:9px 12px;background:transparent;color:#b9b0cc;font-size:12px}.chip.selected{background:var(--violet);color:#1b1233;border-color:var(--violet)}.price{font:52px 'Noto Serif Thai';color:#ddd0ff}.price small{font:15px 'IBM Plex Sans Thai';color:var(--muted)}.loading{text-align:center;padding:110px 22px}.orb{width:84px;height:84px;margin:auto;display:grid;place-items:center;border-radius:50%;border:1px solid #c4b5fd44;background:#c4b5fd18;box-shadow:0 0 60px #c4b5fd44;font-size:30px;animation:pulse 1.4s infinite alternate}@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 90px #c4b5fd66}}.reading{line-height:2;color:#ddd7e8;font-size:15px}.reading h3{font:20px 'Noto Serif Thai';color:#e9ddff;margin:20px 0 6px}.share{background:linear-gradient(140deg,#271b4a,#111126);border-color:#c4b5fd33}.share-quote{font:19px/1.8 'Noto Serif Thai';color:#fff}.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px}.share-grid button{border:1px solid var(--line);background:#ffffff09;color:#d9d0e9;border-radius:12px;padding:10px 4px;font-size:11px}.share-grid button:hover{background:#c4b5fd18}.history-item{display:block;color:inherit;border:1px solid var(--line);background:#ffffff05;border-radius:17px;padding:16px;margin-top:10px}.history-item:hover{border-color:#c4b5fd66}.pill{display:inline-block;background:#c4b5fd18;color:#d8c4ff;border-radius:99px;padding:4px 9px;font-size:11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.stat{background:#ffffff08;border-radius:13px;padding:13px}.stat b{display:block;font:22px 'Noto Serif Thai';color:#d8c4ff}.stat small{color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;z-index:10;left:50%;bottom:92px;transform:translateX(-50%);background:#2c2550;color:#fff;border:1px solid #c4b5fd55;border-radius:99px;padding:10px 16px;font-size:13px;box-shadow:0 10px 30px #0008}
@media(min-width:600px){.page{padding-left:0;padding-right:0}.topbar{padding-left:0;padding-right:0}.hero{padding:48px}.cats{grid-template-columns:repeat(5,1fr)}.cat{min-height:120px}}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), storeKey='duang19-standalone-history';
let state={page:'home',form:{name:'',birthDate:'',birthTime:'',gender:'',relationship:'',category:'ความรัก',question:''},reading:null};
const cats=[['❤️','ความรัก'],['💰','การเงิน'],['💼','การงาน'],['🔮','ชีวิต'],['✨','โชคลาภ']];
function history(){try{return JSON.parse(localStorage.getItem(storeKey)||'[]')}catch{return[]}}
function saveHistory(item){localStorage.setItem(storeKey,JSON.stringify([item,...history()].slice(0,20)))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1800)}
function nav(active){return `<nav class="bottom">${[['home','🏠','หน้าแรก'],['fortune','🔮','ดูดวง'],['history','📖','ประวัติ'],['profile','👤','โปรไฟล์']].map(x=>`<button class="nav ${active===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function shell(content,active='home'){return `<header class="topbar"><div class="brand">DUANG 19<small>คำตอบที่ค้างอยู่ในใจ</small></div><button class="ghost btn" style="padding:9px 13px;font-size:12px" onclick="go('${active==='profile'?'home':'profile'}')">${active==='profile'?'กลับหน้าแรก':'โปรไฟล์'}</button></header><main class="page">${content}</main>${nav(active)}`}
function home(){return shell(`<section class="hero"><div class="eyebrow">✦ AI วิเคราะห์ดวงเฉพาะบุคคล</div><h1 class="display">ถามเรื่องที่คุณ<br><span style="color:#d8c4ff">อยากรู้ที่สุด</span></h1><p>เล่าเรื่องที่กำลังค้างอยู่ในใจ แล้วให้ AI เรียบเรียงสัญญาณเป็นคำตอบที่อบอุ่น ลึกลับน่าติดตาม และใช้เป็นแนวทางได้</p><button class="btn primary" style="margin-top:25px" onclick="go('fortune')">เปิดคำทำนายฟรี　→</button><div class="muted" style="margin-top:12px">ไม่มีค่าใช้จ่าย · ใช้เวลาประมาณ 2 นาที</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">คำถามที่คนถามกันบ่อย</div><h2>บางคำตอบอาจอยู่ใกล้กว่าที่คิด</h2></div><span style="font-size:23px">✧</span></div><div class="questions">${['เขายังคิดถึงเราไหม?','ปีนี้จะมีแฟนไหม?','งานใหม่เหมาะกับเราหรือเปล่า?'].map(q=>`<button class="question" onclick="go('fortune');state.form.question='${q}'">“${q}” <span>→</span></button>`).join('')}</div></section><section class="section"><div class="eyebrow">เลือกหมวดที่กำลังค้างคาใจ</div><div class="cats" style="margin-top:12px">${cats.map(c=>`<button class="cat" onclick="go('fortune');state.form.category='${c[1]}'"><b>${c[0]}</b>${c[1]}</button>`).join('')}</div></section><div class="note section">🛡️ <span>คำทำนายเป็นแนวทางสะท้อนใจ ไม่ใช่คำวินิจฉัยทางการแพทย์ กฎหมาย หรือคำแนะนำการลงทุน</span></div>`)}
function fortune(){const f=state.form;return shell(`<div class="title-row"><button class="back" onclick="go('home')">←</button><div><div class="eyebrow">DUANG 19 / เปิดคำถาม</div><h2>เล่าเรื่องที่ค้างอยู่ในใจ</h2></div></div><form onsubmit="event.preventDefault();checkout()"><section class="card"><div class="steps"><span class="step">1</span><div><b>ข้อมูลของคุณ</b><div class="muted">ใช้เพื่อทำให้คำทำนายเป็นของคุณมากขึ้น</div></div></div><div class="field"><label>ชื่อเล่น</label><input required maxlength="80" value="${f.name}" oninput="state.form.name=this.value" placeholder="เช่น มายด์"></div><div class="field"><label>วันเกิด</label><input required type="date" value="${f.birthDate}" oninput="state.form.birthDate=this.value"></div><div class="field"><label>เวลาเกิด <span>(ไม่บังคับ)</span></label><input type="time" value="${f.birthTime}" oninput="state.form.birthTime=this.value"></div><div class="field"><label>เพศ <span>(ไม่บังคับ)</span></label><select onchange="state.form.gender=this.value"><option value="">ไม่ระบุ</option><option>หญิง</option><option>ชาย</option><option>ไม่จำกัดเพศ</option></select></div><div class="field"><label>สถานะความสัมพันธ์</label><select required onchange="state.form.relationship=this.value"><option value="">เลือกสถานะ</option><option>โสด</option><option>กำลังคุย</option><option>มีแฟน</option><option>ซับซ้อน</option><option>แต่งงานแล้ว</option></select></div></section><section class="card" style="margin-top:12px"><div class="steps"><span class="step">2</span><div><b>คำถามที่อยากรู้</b><div class="muted">ถามให้ชัดที่สุดเท่าที่ใจคุณพร้อม</div></div></div><div class="chips">${cats.map(c=>`<button type="button" class="chip ${f.category===c[1]?'selected':''}" onclick="state.form.category='${c[1]}';render()">${c[0]} ${c[1]}</button>`).join('')}</div><div class="field"><label>คำถามของคุณ</label><textarea required minlength="10" maxlength="1000" rows="5" oninput="state.form.question=this.value" placeholder="เช่น คนที่เรากำลังคุยด้วยคิดยังไงกับเรา?">${f.question}</textarea></div></section><button class="btn primary full" style="margin-top:14px">เปิดคำทำนายฟรี　→</button></form>`, 'fortune')}
function checkout(){if(!state.form.name||!state.form.birthDate||!state.form.relationship||state.form.question.length<10){toast('กรุณากรอกข้อมูลให้ครบถ้วน');return}pay()}
function pay(){state.page='loading';render();setTimeout(()=>{const f=state.form;const quote='สิ่งที่คุณคิดถึงกำลังค่อย ๆ คลี่คลายไปในจังหวะของมัน';const text=`### 🔮 คำตอบของดวง\n\nคำถามของคุณสะท้อนว่าคุณกำลังยืนอยู่ระหว่างความหวังกับความไม่แน่ใจ พลังโดยรวมชี้ให้เห็นว่าคำตอบไม่ได้หายไป แต่กำลังค่อย ๆ ปรากฏผ่านการสื่อสารเล็ก ๆ และการตัดสินใจที่ซื่อสัตย์กับความรู้สึกของตัวเอง\n\n### ❤️ สิ่งที่ดวงกำลังบอก\n\nในช่วงนี้คุณมีเสน่ห์จากความเป็นธรรมชาติ คนรอบตัวรับรู้ได้ถึงความตั้งใจจริง แต่บางครั้งคุณอาจพยายามอ่านใจอีกฝ่ายมากเกินไป จนลืมฟังเสียงของตัวเอง สิ่งที่ควรมองหาไม่ใช่คำตอบที่ชัดเจนเพียงครั้งเดียว แต่คือความสม่ำเสมอของการกระทำ\n\n### ⚠️ สิ่งที่ควรระวัง\n\nระวังการตัดสินใจจากความกลัวว่าจะสูญเสีย และอย่าให้ความเงียบของใครคนหนึ่งกลายเป็นคำตัดสินคุณค่าของตัวเอง หากเป็นเรื่องงานหรือการเงิน ควรตรวจสอบข้อมูลและเงื่อนไขจริงก่อนลงมือ\n\n### ✨ คำแนะนำ\n\nลองตั้งคำถามกับตัวเองอย่างอ่อนโยนว่า “ถ้าไม่ต้องกลัวผลลัพธ์ ฉันอยากเลือกอะไร?” จากนั้นเลือกหนึ่งก้าวเล็ก ๆ ที่ทำได้ภายในสัปดาห์นี้ การเปิดใจพูดอย่างตรงไปตรงมาในเวลาที่เหมาะสมจะช่วยให้สถานการณ์เคลื่อนไหว\n\n### 📅 ช่วงเวลาที่น่าสนใจ\n\nภายใน 2–4 สัปดาห์จะมีจังหวะให้คุณเห็นสัญญาณชัดขึ้น โดยเฉพาะจากบทสนทนาหรือโอกาสที่เกิดขึ้นแบบไม่ได้นัดหมาย คำทำนายนี้เป็นแนวทางสะท้อนใจ ไม่ใช่การยืนยันอนาคต และคุณยังเป็นผู้เลือกเส้นทางของตัวเองเสมอ`;state.reading={quote,text,question:f.question,category:f.category,date:new Date().toISOString()};saveHistory(state.reading);state.page='result';render()},1300)}
function loading(){return shell(`<div class="loading"><div class="orb">✦</div><h1 class="display" style="font-size:30px;margin-top:28px">กำลังเปิดดวงของคุณ…</h1><p class="muted">กำลังเรียบเรียงสัญญาณจากคำถามของคุณ</p></div>`,'fortune')}
function result(){const r=state.reading||history()[0];if(!r)return go('fortune');return shell(`<div class="title-row"><button class="back" onclick="go('history')">←</button><div><div class="eyebrow">YOUR READING</div><h2>คำตอบของดวง</h2></div></div><article class="card"><div class="eyebrow">✦ คำทำนายเฉพาะบุคคล</div><div class="reading" style="margin-top:12px">${r.text.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/\n\n/g,'<br><br>')}</div></article><section class="card share" style="margin-top:12px"><div class="eyebrow">SHARE A LITTLE LIGHT</div><div class="share-quote">“${r.quote}”</div><div style="color:#d8c4ff;margin-top:12px;font-size:13px">อยากรู้ดวงของคุณ? ดูดวง 19</div><div class="share-grid"><button onclick="share('facebook')">Facebook</button><button onclick="share('line')">LINE</button><button onclick="share('x')">X</button><button onclick="share('copy')">คัดลอกลิงก์</button></div></section><button class="btn primary full" style="margin-top:14px" onclick="go('fortune')">ถามคำถามใหม่ฟรี　✦</button>`, 'history')}
function share(type){const u=location.href,t=state.reading?.quote||'อยากรู้ดวงของคุณ? ดูดวง 19';if(type==='copy'){navigator.clipboard?.writeText(t+'\n'+u);toast('คัดลอกแล้ว')}else if(type==='facebook')window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u),'_blank');else if(type==='line')window.open('https://line.me/R/msg/text/?'+encodeURIComponent(t+' '+u),'_blank');else window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t)+'&url='+encodeURIComponent(u),'_blank')}
function historyPage(){const h=history();return shell(`<div class="eyebrow">YOUR READINGS</div><h1 class="display" style="font-size:32px">คำทำนายของฉัน</h1><p class="muted">ทุกคำถามที่คุณเคยเลือกให้จักรวาลช่วยสะท้อน</p>${h.length?h.map((r,i)=>`<button class="history-item" onclick="state.reading=history()[${i}];go('result')"><span class="pill">${r.category}</span><div style="margin-top:10px;line-height:1.7;text-align:left">${r.question}</div><div class="muted" style="margin-top:8px;text-align:left">✦ เปิดอ่านคำทำนายอีกครั้ง</div></button>`).join(''):`<section class="card" style="text-align:center;margin-top:22px"><div style="font-size:32px">📖</div><p>ยังไม่มีคำทำนายที่เปิดไว้</p><p class="muted">คำถามแรกของคุณอาจกำลังรออยู่</p><button class="btn primary" onclick="go('fortune')">เปิดคำทำนายฟรี</button></section>`}`,'history')}
function profile(){const username=localStorage.getItem('duang19-username')||'';return shell(`<div class="eyebrow">YOUR PROFILE</div><h1 class="display" style="font-size:32px">โปรไฟล์ของฉัน</h1><section class="card"><div style="font-size:42px">👤</div><h2 class="display" style="margin:10px 0">สมาชิกดูดวง 19</h2><p class="muted">ข้อมูลนี้เก็บไว้ในเบราว์เซอร์ของคุณในเวอร์ชัน standalone</p></section><section class="card" style="margin-top:12px"><div class="eyebrow">REFERRAL LINK</div><p>ชวนเพื่อนมาค้นหาคำตอบด้วยกัน</p><div style="display:flex;gap:7px"><input class="coupon" id="username" value="${username}" placeholder="ตั้ง Username ของคุณ"><button class="btn ghost" onclick="saveUser()">บันทึก</button></div><p class="muted" style="word-break:break-all;margin-top:10px">${location.origin+location.pathname}/ref/${username||'USERNAME'}</p><div class="stats"><div class="stat"><b>0</b><small>ผู้สมัครจากลิงก์</small></div><div class="stat"><b>${history().length}</b><small>คำทำนายของฉัน</small></div></div></section><button class="btn primary full" style="margin-top:14px" onclick="go('fortune')">เปิดคำทำนายฟรี　✦</button>`,'profile')}
function saveUser(){localStorage.setItem('duang19-username',$('#username').value.trim());toast('บันทึก Username แล้ว');render()}
function go(p){state.page=p;render();scrollTo(0,0)}
function render(){const p=state.page;$('#app').innerHTML=p==='home'?home():p==='fortune'?fortune():p==='loading'?loading():p==='result'?result():p==='history'?historyPage():profile()}
render();
</script>
</body>
</html>
